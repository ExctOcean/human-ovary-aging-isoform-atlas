# SQANTI3 6.0: discovery QC, RulesFilter and automatic rescue.
main:
  refGTF: reference/gencode.v50.annotation.gtf
  refFasta: reference/GRCh38.primary_assembly.genome.fa
  cpus: 100
  dir: output/sqanti3_discovery
  output: isoforms
  log_level: INFO
qc:
  enabled: true
  options:
    isoforms: output/isoquant-discovery/Sample01/Sample01.transcript_models.gtf
    min_ref_len: 0
    fasta: false
    genename: false
    novel_gene_prefix: ''
    sites: ATAC,GCAG,GTAG
    window: 20
    aligner_choice: minimap2
    gmap_index: ''
    include_ORF: true
    orf_input: ''
    psauron_threshold: 0.5
    short_reads: ''
    SR_bam: ''
    CAGE_peak: reference/refTSS_v4.1_human_coordinate.hg38.bed
    polyA_motif_list: reference/mouse_and_human.polyA_motif.txt
    polyA_peak: reference/atlas.clusters.3.0.GRCh38.GENCODE_42.bed
    phyloP_bed: reference/hg38.phyloP100way.bed
    expression: ''
    coverage: ''
    fl_count: ''
    isoAnnotLite: false
    gff3: ''
    saturation: false
    report: html
    isoform_hits: false
    ratio_TSS_metric: max
    chunks: 1
    is_fusion: false
    tusco: ''
filter:
  enabled: true
  options:
    common:
      sqanti_class: output/sqanti3_discovery/isoforms_classification.txt
      isoAnnotGFF3: ''
      filter_isoforms: output/sqanti3_discovery/isoforms_corrected.fasta
      filter_gtf: output/sqanti3_discovery/isoforms_corrected.gtf
      filter_sam: ''
      filter_faa: ''
      skip_report: false
      filter_mono_exonic: false
    rules:
      enabled: true
      options:
        json_filter: preprocessing/sqanti3_filter_default.json
    ml:
      enabled: false
rescue:
  enabled: true
  options:
    filter_class: output/sqanti3_discovery/isoforms_RulesFilter_classification.txt
    corrected_isoforms_fasta: output/sqanti3_discovery/isoforms_corrected.fasta
    filtered_isoforms_gtf: output/sqanti3_discovery/isoforms.filtered.gtf
    refClassif: ''
    counts: ''
    rescue_mono_exonic: all
    mode: automatic
    requant: false
    strategy: rules
    json_filter: preprocessing/sqanti3_filter_default.json
    random_forest: output/sqanti3_discovery/isoformsrandomforest.RData
    threshold: 0.7
